[workspace]
resolver = "2"
members = ["."]

[package]
name = "picoalloc-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[features]
default = ["realloc_inplace"]
realloc_inplace = ["picoalloc/realloc_inplace"]

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
oorandom = "11.1.5"
picoalloc = { path = "..", default-features = false, features = ["paranoid"] }

[[bin]]
name = "allocator_system"
path = "fuzz_targets/allocator_system.rs"
test = false
doc = false
bench = false

[[bin]]
name = "allocator_buffer"
path = "fuzz_targets/allocator_buffer.rs"
test = false
doc = false
bench = false

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
